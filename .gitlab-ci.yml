include:
  - project: sysadmin/ci-utilities
    file:
      - /gitlab-templates/reuse-lint.yml

autotest:
  stage: "build"
  variables:
     FF_NETWORK_PER_BUILD: 1
     AMQP_URL: amqp://amqp
     POSTGRES_DATABASE: foss-public-alert-server
     POSTGRES_HOST: db
     POSTGRES_USER: postgres
     POSTGRES_PASSWORD: password
     WEB_PUSH_CONTACT: "mailto:ci@example.com"
     # ATTENTION: These keys are only for testing in the CI, Do not use these keys in production
     WEB_PUSH_CONFIG_PUBLIC_KEY: "BISP8d-nxdLcdCWFPyJtPlLwTd55GigHgjelmb57mUBPozHRmQw1Z8kRu2eHnQYZbpjRNNWKy10p0IeCVG6Gxgk"
     WEB_PUSH_CONFIG_PRIVATE_KEY: "QXbtg1dXsz-y9A6Xvcu2llqQk4J_LCKu2ClT7zkCnlE"
     DJANGO_SECRET_KEY: "u7%sp@ngm5w(2^pmb*-6lu73(utwwmwn#lshpo#nh^!(-7hat("

  services:
    - name: postgis/postgis:14-3.2
      alias: db
      variables:
        POSTGRES_DB: foss-public-alert-server
    - name: rabbitmq:4.2
      alias: amqp
  image: python:3.12-trixie
  tags:
    - Linux
  before_script:
     - apt-get update && apt-get -y install libgdal-dev
     - pip install uv
  script:
     - cd foss_public_alert_server
     - cd lib && PYTHONPATH=$PYTHONPATH:.. uv run -m unittest discover && cd ..
     - uv run manage.py test

container:
  stage: "publish"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  image: storage.kde.org/vm-images/image-builder
  tags:
    - VM
    - amd64
  variables:
    IMAGE_TAG: latest
    IMAGE_NAME: foss-public-alert-server
  script:
    - podman login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - podman build --pull --build-arg REVISION="$CI_COMMIT_SHORT_SHA" --no-cache --tag ${CI_REGISTRY}/${CI_PROJECT_PATH}/${IMAGE_NAME}:${IMAGE_TAG} foss_public_alert_server/
    - podman push ${CI_REGISTRY}/${CI_PROJECT_PATH}/${IMAGE_NAME}:${IMAGE_TAG}
